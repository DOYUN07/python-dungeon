<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body { margin: 0; } [hidden] { display: none !important; }</style>
<title>파이썬 던전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: one-screen dungeon — HUD strip, monster arena, question console. Deliberate single dark theme (torchlit dungeon). */
:root {
  --bg: #161827;
  --panel: #20233a;
  --panel-2: #2a2e4a;
  --line: #3a3f63;
  --ink: #ebe6d6;
  --muted: #a3a2b8;
  --torch: #f2a541;
  --torch-dim: #8a5d24;
  --good: #4cc38a;
  --bad: #ec5b5b;
  --code-bg: #0f111d;
  --kw: #c792ea;
  --str: #b5d47a;
  --num: #f78c6c;
  --fn: #7fc8f8;
  --cm: #6b6f8f;
  --display: "Silkscreen", "IBM Plex Sans KR", monospace;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: "JetBrains Mono", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 780px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 32px; display: flex; flex-direction: column; gap: 14px; }

/* HUD */
.hud { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 10px 14px; background: var(--panel); border: 2px solid var(--line); font-variant-numeric: tabular-nums; }
.hud .floor { font-family: var(--display); color: var(--torch); font-size: 15px; }
.hud .hearts { color: var(--bad); font-size: 20px; letter-spacing: 2px; }
.hud .hearts .lost { color: var(--line); }
.hud .stat { font-size: 13px; color: var(--muted); }
.hud .stat b { color: var(--ink); font-family: var(--mono); font-size: 15px; }
.hud .spacer { flex: 1; }
.hud .quit { background: none; border: 1px solid var(--line); color: var(--muted); font-size: 12px; padding: 3px 8px; }
.hud .quit:hover { color: var(--ink); border-color: var(--muted); }
.combo { font-family: var(--display); color: var(--torch); font-size: 13px; }
.combo[data-on="0"] { color: var(--line); }

/* Arena */
.arena { position: relative; display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; padding: 16px; background:
  radial-gradient(circle at 18% 50%, rgba(242,165,65,.14), transparent 55%), var(--panel); border: 2px solid var(--line); }
.arena canvas { width: 120px; height: 120px; image-rendering: pixelated; display: block; }
.arena .mon-name { font-family: var(--display); font-size: 15px; margin: 0 0 6px; text-wrap: balance; }
.arena .mon-name small { display: block; font-family: var(--body); font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.hpbar { height: 14px; background: var(--code-bg); border: 2px solid var(--line); position: relative; }
.hpbar i { position: absolute; inset: 0 auto 0 0; background: var(--bad); transition: width .35s steps(6); }
.hptext { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 4px; }
.shake { animation: shake .35s; }
.hit { animation: hit .4s; }
@keyframes shake { 20%,60% { transform: translateX(-6px) } 40%,80% { transform: translateX(6px) } }
@keyframes hit { 0% { filter: none } 30% { filter: brightness(3) } 50% { transform: translateX(8px) } 100% { filter: none; transform: none } }
.dmg { position: absolute; left: 70px; top: 20px; font-family: var(--display); font-size: 22px; color: var(--torch); pointer-events: none; animation: float 0.9s forwards; }
@keyframes float { to { transform: translateY(-34px); opacity: 0 } }

/* Console */
.console { background: var(--panel); border: 2px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.qbody { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-family: var(--display); font-size: 11px; letter-spacing: .08em; padding: 3px 8px; background: var(--panel-2); color: var(--torch); border: 1px solid var(--torch-dim); }
.tag.lv { color: var(--muted); border-color: var(--line); }
.timer { flex: 1; min-width: 120px; max-width: 260px; height: 8px; background: var(--code-bg); border: 1px solid var(--line); position: relative; }
.timer i { position: absolute; inset: 0 auto 0 0; background: var(--torch); }
.timer.low i { background: var(--bad); }
.notimer { font-size: 12px; color: var(--muted); }
.q { font-size: 16px; font-weight: 600; margin: 0; }
.qsub { margin: 0; color: var(--muted); font-size: 14px; }
pre.code { margin: 0; background: var(--code-bg); border: 1px solid var(--line); padding: 12px 14px; font-family: var(--mono); font-size: 14px; line-height: 1.6; overflow-x: auto; color: var(--ink); }
pre.code.small { font-size: 13px; }
.k { color: var(--kw); } .s { color: var(--str); } .n { color: var(--num); } .f { color: var(--fn); } .c { color: var(--cm); font-style: italic; }
.blank { color: var(--bg); background: var(--torch); padding: 0 4px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 520px) { .opts { grid-template-columns: 1fr; } .arena canvas { width: 88px; height: 88px; } }
button { font: inherit; color: inherit; cursor: pointer; }
.opt { text-align: left; background: var(--panel-2); border: 2px solid var(--line); padding: 10px 12px; font-family: var(--mono); font-size: 14px; display: flex; gap: 10px; align-items: baseline; min-width: 0; overflow-wrap: anywhere; }
.opt kbd { font-family: var(--display); font-size: 11px; color: var(--muted); }
.opt:hover:not(:disabled) { border-color: var(--torch); }
:focus-visible { outline: 2px solid var(--torch); outline-offset: 2px; }
.opt.right { border-color: var(--good); background: rgba(76,195,138,.12); }
.opt.wrong { border-color: var(--bad); background: rgba(236,91,91,.12); }
.opt:disabled { cursor: default; }
.btn { background: var(--torch); color: var(--bg); border: 0; padding: 10px 18px; font-family: var(--display); font-size: 13px; box-shadow: 0 4px 0 var(--torch-dim); }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--torch-dim); }
.btn.ghost { background: var(--panel-2); color: var(--ink); box-shadow: 0 4px 0 var(--line); }
.btn.small { padding: 6px 12px; font-size: 11px; }
.btn:disabled { opacity: .4; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
input[type="text"] { flex: 1; min-width: 0; background: var(--code-bg); border: 2px solid var(--line); color: var(--ink); font-family: var(--mono); font-size: 15px; padding: 9px 12px; }
textarea.editor { width: 100%; min-height: 220px; resize: vertical; background: var(--code-bg); border: 2px solid var(--line); color: var(--ink); font-family: var(--mono); font-size: 14px; line-height: 1.6; padding: 12px 14px; tab-size: 4; white-space: pre; overflow: auto; }
textarea.editor:focus { border-color: var(--torch-dim); outline: none; }

.feedback { border: 2px solid var(--line); padding: 12px 14px; background: var(--panel-2); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.feedback.ok { border-color: var(--good); }
.feedback.no { border-color: var(--bad); }
.feedback h3 { margin: 0; font-family: var(--display); font-size: 15px; }
.feedback.ok h3 { color: var(--good); } .feedback.no h3 { color: var(--bad); }
.feedback p { margin: 0; color: var(--ink); }
.feedback code, .qsub code, .log code { font-family: var(--mono); background: var(--code-bg); padding: 1px 5px; }
.feedback .lbl { font-size: 12px; color: var(--muted); }

/* Test results */
.results { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tres { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 8px 10px; background: var(--code-bg); border: 1px solid var(--line); font-family: var(--mono); font-size: 13px; min-width: 0; }
.tres .mark { font-weight: 700; }
.tres.pass .mark { color: var(--good); } .tres.fail .mark { color: var(--bad); }
.tres .expr { overflow-wrap: anywhere; }
.tres .detail { grid-column: 2; color: var(--muted); overflow-wrap: anywhere; }
.tres .detail b { color: var(--ink); font-weight: 400; }
.status { font-size: 13px; color: var(--muted); }
.status.err { color: var(--bad); }

/* Puzzles shared */
.target { font-family: var(--mono); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.target span.lbl { font-family: var(--body); font-size: 13px; color: var(--muted); margin-right: 4px; }
.cell { min-width: 38px; height: 34px; padding: 0 4px; display: inline-grid; place-items: center; font-family: var(--mono); font-weight: 700; border: 2px solid var(--line); background: var(--code-bg); }
.cell.done { border-color: var(--good); color: var(--good); }
.cell.next { border-color: var(--torch); }
.cell.ghost { border-style: dashed; color: transparent; }
.board { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.zone { background: var(--code-bg); border: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 6px; min-height: 210px; min-width: 0; }
.zone h4 { margin: 0 0 4px; font-family: var(--display); font-size: 11px; color: var(--muted); letter-spacing: .06em; }
.zone .items { display: flex; flex-direction: column; gap: 4px; align-items: center; }
.zone.stack .items { flex: 1; justify-content: flex-end; border: 2px solid var(--line); border-top: 0; padding: 6px 4px; }
.zone .hint { font-size: 11px; color: var(--muted); text-align: center; }
.svgbox { background: var(--code-bg); border: 1px solid var(--line); overflow-x: auto; }
.svgbox svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
.gedge { stroke: var(--line); stroke-width: 2.5; }
.gnode { cursor: pointer; }
.gnode circle { fill: var(--panel-2); stroke: var(--muted); stroke-width: 2; }
.gnode:hover circle, .gnode:focus-visible circle { stroke: var(--torch); }
.gnode:focus { outline: none; }
.gnode.start circle { stroke: var(--torch); stroke-width: 3; }
.gnode.done circle { fill: #1f3a30; stroke: var(--good); }
.gnode text { fill: var(--ink); font-family: var(--mono); font-weight: 700; font-size: 15px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.gnode .ord { fill: var(--good); font-size: 11px; }
.log { font-family: var(--mono); font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
.log b { color: var(--ink); font-weight: 400; }
.bs { display: flex; flex-wrap: wrap; gap: 4px; }
.bs button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px 4px; min-width: 40px; background: var(--code-bg); border: 2px solid var(--line); font-family: var(--mono); }
.bs button b { font-size: 15px; }
.bs button small { font-size: 10px; color: var(--muted); }
.bs button em { font-style: normal; font-size: 10px; color: var(--torch); height: 12px; line-height: 12px; }
.bs button:hover:not(:disabled) { border-color: var(--torch); }
.bs button.out { opacity: .28; }
.bs button.probe { border-color: var(--muted); }
.bs button.found { border-color: var(--good); color: var(--good); }

/* Screens */
.screen { background: var(--panel); border: 2px solid var(--line); padding: 24px 20px; display: flex; flex-direction: column; gap: 18px; }
.screen h1 { margin: 0; font-family: var(--display); font-size: clamp(28px, 7vw, 44px); line-height: 1.1; color: var(--torch); text-wrap: balance; }
.screen h1 small { display: block; font-family: var(--body); font-size: 15px; color: var(--muted); font-weight: 400; margin-top: 8px; }
.screen h2 { margin: 0; font-family: var(--display); font-size: 13px; letter-spacing: .08em; color: var(--muted); }
.screen p { margin: 0; max-width: 62ch; }
.section { display: flex; flex-direction: column; gap: 10px; }
.seg { display: inline-flex; border: 2px solid var(--line); width: fit-content; max-width: 100%; flex-wrap: wrap; }
.seg label { cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; padding: 8px 16px; font-size: 14px; color: var(--muted); }
.seg input:checked + span { background: var(--torch); color: var(--bg); font-weight: 700; }
.seg input:focus-visible + span { outline: 2px solid var(--torch); outline-offset: -4px; }
.diffnote { font-size: 13px; color: var(--muted); }
.tabs { display: flex; gap: 0; border-bottom: 2px solid var(--line); }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -2px; padding: 8px 14px; font-family: var(--display); font-size: 13px; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--torch); border-bottom-color: var(--torch); }
.stages { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.stage { text-align: left; background: var(--panel-2); border: 2px solid var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stage:hover { border-color: var(--torch); }
.stage .nm { font-weight: 700; font-size: 15px; }
.stage .tp { font-family: var(--display); font-size: 10px; letter-spacing: .08em; color: var(--torch); }
.stage .ds { font-size: 12px; color: var(--muted); }
.stage .stars { font-size: 15px; letter-spacing: 2px; color: var(--torch); }
.stage .stars .off { color: var(--line); }
.topics { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.topics label, .check { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: var(--panel-2); border: 2px solid var(--line); cursor: pointer; }
.topics label:has(input:checked) { border-color: var(--torch); }
.topics input, .check input { accent-color: var(--torch); margin-top: 4px; }
.topics b { display: block; font-size: 14px; }
.topics span, .check span { font-size: 12px; color: var(--muted); }
.check { background: none; border: 0; padding: 0; }
.rules { display: grid; gap: 4px; font-size: 13px; color: var(--muted); padding: 0; margin: 0; list-style: none; }
.rules li::before { content: "▸ "; color: var(--torch); }
.big { font-family: var(--display); font-size: 34px; color: var(--torch); font-variant-numeric: tabular-nums; }
.bigstars { font-size: 40px; letter-spacing: 6px; color: var(--torch); }
.bigstars .off { color: var(--line); }
.stats { display: flex; gap: 24px; flex-wrap: wrap; }
.stats div { font-size: 12px; color: var(--muted); }
.stats b { display: block; font-family: var(--mono); font-size: 20px; color: var(--ink); }
.muted { color: var(--muted); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .shake, .hit, .dmg { animation: none !important; } .hpbar i { transition: none; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// =====================================================================
// Question bank. g = 주제(스테이지), lv = 난이도 1~3, 정답은 opts[0].
// =====================================================================
const BANK = {
  out: [
    { g: "basic", lv: 1, code: `a = [1, 2, 3]\nb = a\nb.append(4)\nprint(a)`, opts: ["[1, 2, 3, 4]", "[1, 2, 3]", "[4]", "오류"], ex: "<code>b = a</code>는 복사가 아니라 같은 리스트에 이름을 하나 더 붙이는 것입니다. 복사가 필요하면 <code>a[:]</code> 또는 <code>a.copy()</code>." },
    { g: "basic", lv: 1, code: `print([1, 2, 3, 4, 5][1:4])`, opts: ["[2, 3, 4]", "[1, 2, 3, 4]", "[2, 3, 4, 5]", "[1, 2, 3]"], ex: "슬라이싱 <code>[start:end]</code>는 start 포함, end 미포함입니다. 인덱스 1, 2, 3." },
    { g: "basic", lv: 3, code: `def f(x, items=[]):\n    items.append(x)\n    return items\n\nf(1)\nprint(f(2))`, opts: ["[1, 2]", "[2]", "[1]", "None"], ex: "기본값 <code>[]</code>는 함수 정의 시점에 한 번만 만들어져 호출 사이에 공유됩니다. 보통 <code>items=None</code>으로 받고 안에서 새 리스트를 만듭니다." },
    { g: "basic", lv: 1, code: `print("python"[::-1])`, opts: ["nohtyp", "python", "p", "오류"], ex: "step이 -1이면 뒤에서부터 거꾸로 읽습니다." },
    { g: "basic", lv: 1, code: `print(7 // 2, 7 % 2)`, opts: ["3 1", "3.5 1", "3 0.5", "4 1"], ex: "<code>//</code>는 몫(정수 나눗셈), <code>%</code>는 나머지." },
    { g: "basic", lv: 1, code: `print([i * i for i in range(4)])`, opts: ["[0, 1, 4, 9]", "[1, 4, 9, 16]", "[0, 1, 4, 9, 16]", "[0, 2, 4, 6]"], ex: "<code>range(4)</code>는 0, 1, 2, 3." },
    { g: "basic", lv: 2, code: `print(bool([]), bool([0]))`, opts: ["False True", "False False", "True True", "True False"], ex: "빈 컬렉션은 False, 원소가 하나라도 있으면 True. 원소가 0이어도 리스트 자체는 비어 있지 않습니다." },
    { g: "basic", lv: 3, code: `a = [[0] * 2] * 2\na[0][0] = 1\nprint(a)`, opts: ["[[1, 0], [1, 0]]", "[[1, 0], [0, 0]]", "[[1, 1], [0, 0]]", "오류"], ex: "바깥 <code>* 2</code>는 같은 내부 리스트를 두 번 참조합니다. 2차원 배열은 <code>[[0]*2 for _ in range(2)]</code>로 만드세요." },
    { g: "basic", lv: 2, code: `print(0.1 + 0.2 == 0.3)`, opts: ["False", "True", "오류", "0.3"], ex: "부동소수점 오차로 0.1 + 0.2는 0.30000000000000004. 비교는 <code>math.isclose</code>로." },
    { g: "basic", lv: 2, code: `t = (1,)\nprint(type(t).__name__)`, opts: ["tuple", "int", "list", "set"], ex: "원소 하나짜리 튜플은 쉼표가 필요합니다. <code>(1)</code>은 그냥 int." },
    { g: "basic", lv: 2, code: `x = [1, 2, 3]\ny = x + [4]\nx.append(5)\nprint(y)`, opts: ["[1, 2, 3, 4]", "[1, 2, 3, 5, 4]", "[1, 2, 3, 4, 5]", "[1, 2, 3]"], ex: "<code>+</code>는 새 리스트를 만듭니다. 이후 x를 바꿔도 y는 영향이 없습니다." },
    { g: "hash", lv: 1, code: `print(len({1, 2, 2, 3, 3, 3}))`, opts: ["3", "6", "4", "1"], ex: "set은 중복을 제거합니다. 남는 원소는 1, 2, 3." },
    { g: "hash", lv: 1, code: `d = {"a": 1}\nprint(d.get("b", 0))`, opts: ["0", "None", "KeyError", "1"], ex: "<code>dict.get(key, default)</code>는 키가 없으면 default를 돌려줍니다. <code>d[\"b\"]</code>였다면 KeyError." },
    { g: "hash", lv: 1, code: `cnt = {}\nfor ch in "banana":\n    cnt[ch] = cnt.get(ch, 0) + 1\nprint(cnt["a"])`, opts: ["3", "2", "1", "6"], ex: "dict로 빈도 세기. 'a'는 세 번 나옵니다. <code>collections.Counter</code>로도 가능." },
    { g: "hash", lv: 1, code: `d = {"a": 1, "b": 2}\nd["a"] = 3\nprint(len(d), d["a"])`, opts: ["2 3", "3 3", "2 1", "3 1"], ex: "이미 있는 키에 대입하면 값이 덮어써질 뿐 키가 늘지 않습니다." },
    { g: "hash", lv: 2, code: `print({1, 2, 3} & {2, 3, 4})`, opts: ["{2, 3}", "{1, 2, 3, 4}", "{1, 4}", "[2, 3]"], ex: "<code>&</code>는 교집합, <code>|</code>는 합집합, <code>-</code>는 차집합." },
    { g: "hash", lv: 2, code: `from collections import Counter\nprint(Counter("hello").most_common(1))`, opts: ["[('l', 2)]", "[('h', 1)]", "('l', 2)", "{'l': 2}"], ex: "<code>most_common(k)</code>는 (원소, 개수) 튜플의 리스트를 빈도순으로 돌려줍니다." },

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
function highlight(src) {
  const re = /(#[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|\b(def|return|if|else|elif|for|in|while|import|from|True|False|None|lambda|not|and|or|class|is|try|except|pass)\b|\b(print|len|range|sorted|type|bool|set|list|dict|deque|max|min|sum|any|isinstance|enumerate|int)\b|\b(\d+(?:\.\d+)?)\b|(___)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const t = esc(m[0]);
    out += m[1] ? `<span class="c">${t}</span>` : m[2] ? `<span class="s">${t}</span>` : m[3] ? `<span class="k">${t}</span>`
      : m[4] ? `<span class="f">${t}</span>` : m[5] ? `<span class="n">${t}</span>` : `<span class="blank">???</span>`;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
function shade(hex, k) {
  const v = parseInt(hex.slice(1), 16), f = c => Math.max(0, Math.min(255, Math.round(c * (1 + k))));
  return "#" + [(v >> 16) & 255, (v >> 8) & 255, v & 255].map(f).map(c => c.toString(16).padStart(2, "0")).join("");
}
function drawSprite(canvas, key, color) {
  const rows = SPRITES[key], n = rows.length, ctx = canvas.getContext("2d");
  canvas.width = n; canvas.height = n; ctx.clearRect(0, 0, n, n);
  const dark = shade(color, -0.35);
  rows.forEach((r, y) => [...r].forEach((ch, x) => {
    const col = ch === "a" ? color : ch === "b" ? dark : ch === "e" ? "#fff8e1" : null;
    if (col) { ctx.fillStyle = col; ctx.fillRect(x, y, 1, 1); }
  }));
}
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const starsHtml = (n, cls = "") => `<span class="${cls}">${[1, 2, 3].map(i => i <= n ? "★" : `<span class="off">★</span>`).join("")}</span>`;

const BRY = "https://cdn.jsdelivr.net/npm/brython@3.13.2/";
let pyReady = null, pyRunId = 0;
function loadPy() {
  if (pyReady) return pyReady;
  const add = src => new Promise((ok, fail) => {
    const s = document.createElement("script"); s.src = src; s.onload = ok;
    s.onerror = () => fail(new Error("파이썬 엔진을 불러오지 못했습니다. 네트워크를 확인하고 다시 시도하세요."));
    document.head.appendChild(s);
  });
  pyReady = add(BRY + "brython.min.js").then(() => add(BRY + "brython_stdlib.js")).then(() => { window.brython({ debug: 0 }); })
    .catch(e => { pyReady = null; throw e; });
  return pyReady;
}
const HARNESS = `
import sys, json
from browser import window
class _Out:
    def __init__(self):
        self.buf = []
    def write(self, t):
        self.buf.append(str(t))
    def flush(self):
        pass
_out = _Out()
_old = sys.stdout
sys.stdout = _out
_res = []
_err = None
_ns = {"__name__": "__main__"}
try:
    exec(__SRC__, _ns)
except BaseException as e:
    _err = type(e).__name__ + ": " + str(e)
if _err is None:
    for _expr, _exp in __TESTS__:
        try:
            _got = eval(_expr, _ns)
            _want = eval(_exp, _ns)
            _res.append([_expr, repr(_want), repr(_got), bool(_got == _want)])
        except BaseException as e:
            _res.append([_expr, _exp, type(e).__name__ + ": " + str(e), False])
sys.stdout = _old
window.pdReport(json.dumps({"out": "".join(_out.buf), "err": _err, "tests": _res}))
`;
function runPython(src, tests = []) {
  return loadPy().then(() => new Promise((ok, fail) => {
    let got = null;
    window.pdReport = s => { got = JSON.parse(s); };
    const prog = HARNESS.replace("__SRC__", () => JSON.stringify(src)).replace("__TESTS__", () => JSON.stringify(tests));
    try { window.__BRYTHON__.runPythonSource(prog, "pd_run_" + (++pyRunId)); }
    catch (e) { return fail(new Error("실행기 오류: " + (e && e.message || e))); }
    got ? ok(got) : fail(new Error("실행 결과를 받지 못했습니다."));
  }));
}

// Game flow
// =====================================================================
function buildPool(cfg) {
  const D = DIFF[prefs.diff], pool = [];
  for (const type of ["out", "big", "blank", "code"]) {
    if (cfg.mode === "endless" && !cfg.types.includes(type)) continue;
    if (cfg.mode === "stage" && type === "code" && !prefs.code) continue;
    for (const card of BANK[type]) {
      if (!D.lv.includes(card.lv)) continue;
      if (cfg.mode === "stage" && card.g !== cfg.stage.id) continue;
      pool.push({ type, card });
    }
  }
  for (const t of TYPES.filter(t => t.puzzle)) {
    if (cfg.mode === "endless" && cfg.types.includes(t.id)) pool.push({ type: t.id });
    if (cfg.mode === "stage" && t.puzzle.includes(cfg.stage.id)) pool.push({ type: t.id }, { type: t.id }, { type: t.id });
  }
  return pool;
}

function startGame(cfg) {
  const D = DIFF[prefs.diff];
  const pool = buildPool(cfg);
  if (!pool.length) { alertBox("이 조합에는 문제가 없습니다. 유형이나 난이도를 바꿔 보세요."); return; }
  G = { ...cfg, diff: prefs.diff, pool, deck: [], floor: 1, hp: D.hearts, maxHp: D.hearts, score: 0, combo: 0, bestCombo: 0, solved: 0, tried: 0, kills: 0, last: null };
  newMonster();
}
function alertBox(msg) {
  const old = $("#tabbody .status"); if (old) old.remove();
  const p = document.createElement("p"); p.className = "status err"; p.textContent = msg; $("#tabbody").appendChild(p);
}
function drawEntry() {
  if (!G.deck.length) G.deck = shuffle(G.pool);
  let e = G.deck.pop();
  if (G.pool.length > 1 && G.last && e.card && e.card === G.last.card) { G.deck.unshift(e); e = G.deck.pop(); }
  G.last = e;
  return e;
}

function newMonster() {
  const D = DIFF[G.diff];
  const boss = G.mode === "stage" ? G.floor === STAGE_FLOORS : G.floor % 5 === 0;
  const m = boss ? (G.mode === "stage" ? G.stage.boss : ENDLESS_BOSS) : pick(MONSTERS);
  const hp = boss ? D.boss : D.hp;
  G.mon = { ...m, hp, max: hp, boss };
  renderShell();
  nextQuestion();
}

function renderShell() {
  app.innerHTML = `

function updateHud() {
  const hearts = Array.from({ length: G.maxHp }, (_, i) => `<span class="${i < G.hp ? "" : "lost"}">♥</span>`).join("");
  const where = G.mode === "stage" ? `${G.stage.name} ${G.floor}/${STAGE_FLOORS}` : `B${G.floor}F`;

}

function nextQuestion() {
  const entry = drawEntry();
  const T = typeOf(entry.type), D = DIFF[G.diff];
  const decay = G.mode === "endless" ? Math.max(0.6, 1 - (G.floor - 1) * 0.03) : 1;
  const limit = T.time ? T.time * D.time * decay : 0;
  G.q = { type: entry.type, limit, left: limit, done: false, keys: null };
  const lvTag = entry.card ? `<span class="tag lv">LV ${entry.card.lv}</span>` : "";
  $("#con").innerHTML = `<div class="qhead"><div class="tags"><span class="tag">${T.name}</span>${lvTag}</div>${limit ? `<div class="timer" id="timer"><i id="tfill"></i></div>` : `<span class="notimer">시간 제한 없음</span>`}</div><div class="qbody" id="qbody"></div>`;
  const body = $("#qbody");
  const R = { out: renderMC, big: renderMC, blank: renderBlank, code: renderCode, stack: renderStack, graph: renderGraph, tree: renderTree, bsearch: renderBsearch };
  R[entry.type](body, entry.card);
  if (limit) startTimer();
}

// ---------- Multiple choice ----------
function renderMC(body, card) {
  const correct = card.opts[0];
  const opts = shuffle(card.opts);
  G.q.ex = card.ex; G.q.answerText = correct;
  if (G.q.type === "out") G.q.runnable = card.code;
  body.innerHTML = `
    <p class="q">${card.q || "출력 결과는?"}</p>
    <pre class="code">${highlight(card.code)}</pre>
    <div class="opts">${opts.map((o, i) => `<button class="opt" data-i="${i}"><kbd>${i + 1}</kbd><span>${esc(o)}</span></button>`).join("")}</div>`;
  const btns = [...body.querySelectorAll(".opt")];
  btns.forEach(b => b.onclick = () => {
    if (G.q.done) return;
    const ok = opts[+b.dataset.i] === correct;
    btns.forEach(x => { x.disabled = true; if (opts[+x.dataset.i] === correct) x.classList.add("right"); });
    if (!ok) b.classList.add("wrong");
    resolve(ok);
  });
  G.q.keys = e => { const n = +e.key; if (n >= 1 && n <= btns.length) btns[n - 1].click(); };
}

// ---------- Code writing (run + grade) ----------
function renderCode(body, card) {
  G.q.ex = "모범 답안과 비교해 보세요. 테스트를 모두 통과하는 코드는 여러 가지가 있을 수 있습니다.";
  G.q.answerText = null; G.q.sol = card.sol; G.q.fails = 0;
  body.innerHTML = `
    <p class="q">${card.title}</p>
    <p class="qsub">${card.prompt}</p>
    <textarea class="editor" id="ed" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="코드 편집기">${esc(card.starter)}</textarea>
    <div class="row">
      <button class="btn" id="run">실행해서 채점</button>
      <button class="btn ghost" id="giveup">포기하고 답 보기</button>
      <span class="status" id="st">테스트 ${card.tests.length}개 · Ctrl+Enter로 실행</span>
    </div>
    <div class="results" id="res"></div>`;
  const ed = $("#ed");
  ed.focus();
  const caret = ed.value.indexOf("\n    \n");
  if (caret >= 0) ed.setSelectionRange(caret + 5, caret + 5);
  ed.addEventListener("keydown", e => {
    if (e.key === "Tab") {
      e.preventDefault();
      const s = ed.selectionStart;
      ed.setRangeText("    ", s, ed.selectionEnd, "end");
    } else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
      e.preventDefault(); $("#run").click();
    } else if (e.key === "Enter") {
      e.preventDefault();
      const s = ed.selectionStart, line = ed.value.slice(0, s).split("\n").pop();
      let ind = line.match(/^\s*/)[0];
      if (/:\s*$/.test(line)) ind += "    ";
      ed.setRangeText("\n" + ind, s, ed.selectionEnd, "end");
    }
  });
  $("#giveup").onclick = () => { if (G.q.done) return; lockCode(); resolve(false, { extra: solHtml(card.sol) }); };
  $("#run").onclick = async () => {
    if (G.q.done) return;
    const st = $("#st"), btn = $("#run");
    btn.disabled = true;
    st.className = "status";
    st.textContent = pyReady ? "실행 중…" : "파이썬 엔진 불러오는 중… (처음 한 번만)";
    await new Promise(r => setTimeout(r, 30));
    try {
      const r = await runPython(ed.value, card.tests);
      const pass = r.tests.filter(t => t[3]).length;
      $("#res").innerHTML = resultsHtml(r);
      if (!r.err && pass === card.tests.length) {
        lockCode();
        st.textContent = `테스트 ${pass}/${card.tests.length} 통과`;
        resolve(true, { dmg: 2, mul: 1 / (1 + G.q.fails * 0.5), extra: solHtml(card.sol, "모범 답안") });
      } else {
        G.q.fails++;
        st.className = "status err";
        st.textContent = r.err ? "코드를 실행하다 오류가 났습니다. 고친 뒤 다시 실행하세요." : `테스트 ${pass}/${card.tests.length} 통과 · 고친 뒤 다시 실행하세요 (실패할수록 점수 감소)`;
        btn.disabled = false;
      }
    } catch (e) {
      st.className = "status err"; st.textContent = e.message; btn.disabled = false;
    }
  };
}
function lockCode() { ["#ed", "#run", "#giveup"].forEach(s => { const el = $(s); if (el) el.disabled = true; }); }
function solHtml(sol, label = "모범 답안") { return `<span class="lbl">${label}</span><pre class="code small">${highlight(sol)}</pre>`; }
function resultsHtml(r) {
  let h = "";
  if (r.err) h += `<div class="tres fail"><span class="mark">✗</span><span class="expr">코드 실행</span><span class="detail">${esc(r.err)}</span></div>`;
  for (const [expr, want, got, ok] of r.tests) {
    h += `<div class="tres ${ok ? "pass" : "fail"}"><span class="mark">${ok ? "✓" : "✗"}</span><span class="expr">${esc(expr)}</span>` +
      (ok ? "" : `<span class="detail">기대값 <b>${esc(want)}</b> · 결과 <b>${esc(got)}</b></span>`) + `</div>`;
  }
  if (r.out) h += `<span class="lbl status">print 출력</span><pre class="code small">${esc(r.out)}</pre>`;
  return h;
}

// ---------- Stack puzzle ----------
function makeTarget(n) {
  for (;;) {
    let next = 1; const st = [], out = [];
    while (out.length < n) {
      if (next <= n && (!st.length || Math.random() < 0.55)) st.push(next++);
      else out.push(st.pop());
    }
    if (out.some((v, i) => v !== i + 1)) return out;
  }
}
function renderStack(body) {
  const n = [4, 5, 6][DIFF[G.diff].size];
  const P = { n, target: makeTarget(n), input: Array.from({ length: n }, (_, i) => i + 1), stack: [], out: [] };
  G.q.ex = "스택은 마지막에 넣은 것이 먼저 나옵니다(LIFO). 목표의 다음 숫자가 스택 맨 위에 있을 때만 POP하고, 아니면 그 숫자가 나올 때까지 PUSH하세요.";
  G.q.answerText = P.target.join(" ");
  body.innerHTML = `
    <p class="q">입력 1→${n}을 스택에 넣고 빼서 목표 순서대로 출력하세요.</p>
    <div class="target" id="tg"></div>
    <div class="board">
      <div class="zone"><h4>입력 대기열</h4><div class="items" id="zin"></div></div>
      <div class="zone stack"><h4>스택</h4><div class="items" id="zst"></div><div class="hint">↑ top</div></div>
      <div class="zone"><h4>출력</h4><div class="items" id="zout"></div></div>
    </div>
    <div class="row"><button class="btn" id="bpush">PUSH (Q)</button><button class="btn ghost" id="bpop">POP (W)</button></div>`;
  const draw = () => {
    $("#tg").innerHTML = `<span class="lbl">목표 출력</span>` + P.target.map((v, i) => `<span class="cell ${i < P.out.length ? "done" : i === P.out.length ? "next" : ""}">${v}</span>`).join("");
    $("#zin").innerHTML = P.input.map(v => `<span class="cell">${v}</span>`).join("") || `<span class="cell ghost">·</span>`;
    $("#zst").innerHTML = P.stack.slice().reverse().map(v => `<span class="cell">${v}</span>`).join("");
    $("#zout").innerHTML = P.out.map(v => `<span class="cell done">${v}</span>`).join("");
    $("#bpush").disabled = !P.input.length || G.q.done;
    $("#bpop").disabled = !P.stack.length || G.q.done;
  };
  $("#bpush").onclick = () => { if (G.q.done || !P.input.length) return; P.stack.push(P.input.shift()); draw(); };
  $("#bpop").onclick = () => {
    if (G.q.done || !P.stack.length) return;
    const v = P.stack[P.stack.length - 1];
    const expect = P.target[P.out.length];
    if (v !== expect) {
      G.q.ex = `스택 맨 위의 ${v}를 꺼내려 했지만 목표의 다음 숫자는 ${expect}였습니다. ` + G.q.ex;
      resolve(false); draw(); return;
    }
    P.out.push(P.stack.pop()); draw();
    if (P.out.length === P.n) resolve(true, { dmg: 2 });
  };
  G.q.keys = e => { const k = e.key.toLowerCase(); if (k === "q") $("#bpush").click(); if (k === "w") $("#bpop").click(); };
  draw();
}

// ---------- BFS / DFS puzzle ----------
function makeGraph(n) {
  const pos = i => ({ c: i % 3, r: Math.floor(i / 3) });
  const near = (a, b) => { const p = pos(a), q = pos(b); return a !== b && Math.abs(p.c - q.c) <= 1 && Math.abs(p.r - q.r) <= 1; };
  const E = [];
  const has = (a, b) => E.some(([x, y]) => (x === a && y === b) || (x === b && y === a));
  const crosses = (a, b) => { const p = pos(a), q = pos(b); if (p.c === q.c || p.r === q.r) return false; return has(p.r * 3 + q.c, q.r * 3 + p.c); };
  const chosen = [rnd(0, 8)];
  while (chosen.length < n) {
    const cands = [];
    for (let s = 0; s < 9; s++) if (!chosen.includes(s)) for (const t of chosen) if (near(s, t) && !crosses(s, t)) cands.push([t, s]);
    const [t, s] = pick(cands); chosen.push(s); E.push([t, s]);
  }
  const extra = rnd(1, 2);
  for (let k = 0, tries = 0; k < extra && tries < 60; tries++) {
    const a = pick(chosen), b = pick(chosen);
    if (!near(a, b) || has(a, b) || crosses(a, b)) continue;
    E.push([a, b]); k++;
  }
  const letters = shuffle("ABCDEFG".slice(0, n).split(""));
  const name = {}; chosen.forEach((s, i) => name[s] = letters[i]);
  const nodes = chosen.map(s => ({ id: name[s], x: 60 + pos(s).c * 120 + rnd(-10, 10), y: 40 + pos(s).r * 86 + rnd(-8, 8) }));
  const edges = E.map(([a, b]) => [name[a], name[b]]);
  const adj = {}; nodes.forEach(nd => adj[nd.id] = []);
  edges.forEach(([a, b]) => { adj[a].push(b); adj[b].push(a); });
  Object.values(adj).forEach(l => l.sort());
  return { nodes, edges, adj };
}
function renderGraph(body) {
  const D = DIFF[G.diff];
  const n = [5, 6, 7][D.size];
  const g = makeGraph(n);
  const at = G.mode === "stage" ? G.stage.id : null;
  const algo = at === "linear" ? "BFS" : at === "rec" ? "DFS" : D.size === 0 ? "BFS" : pick(["BFS", "DFS"]);
  const start = "A", order = [], snaps = [];
  if (algo === "BFS") {
    const seen = new Set([start]), q = [start];
    while (q.length) { const u = q.shift(); order.push(u); for (const v of g.adj[u]) if (!seen.has(v)) { seen.add(v); q.push(v); } snaps.push(q.slice()); }
  } else {
    const seen = new Set(), path = [];
    const dfs = u => { seen.add(u); path.push(u); order.push(u); snaps.push(path.slice()); for (const v of g.adj[u]) if (!seen.has(v)) dfs(v); path.pop(); };
    dfs(start);
  }
  G.q.answerText = order.join(" → ");
  G.q.ex = algo === "BFS"
    ? "BFS는 큐를 씁니다. 꺼낸 정점의 이웃 중 아직 안 본 것을 알파벳순으로 큐 뒤에 넣고, 큐 앞에서 다음 정점을 꺼냅니다. 가까운 정점부터 퍼져 나갑니다."
    : "DFS(재귀)는 이웃을 알파벳순으로 보면서 아직 안 간 정점이 있으면 바로 그쪽으로 끝까지 내려가고, 막히면 되돌아옵니다.";
  const W = 380, H = 260;
  body.innerHTML = `
    <p class="q">${start}에서 시작하는 <b>${algo}</b> 방문 순서대로 정점을 클릭하세요.</p>
    <p class="qsub">이웃은 알파벳순으로 확인합니다.</p>
    <div class="svgbox"><svg viewBox="0 0 ${W} ${H}" width="${W}" role="group" aria-label="그래프">
      ${g.edges.map(([a, b]) => { const p = g.nodes.find(x => x.id === a), q = g.nodes.find(x => x.id === b); return `<line class="gedge" x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}"/>`; }).join("")}
      ${g.nodes.map(nd => `<g class="gnode ${nd.id === start ? "start" : ""}" data-id="${nd.id}" tabindex="0" role="button" aria-label="정점 ${nd.id}"><circle cx="${nd.x}" cy="${nd.y}" r="19"/><text x="${nd.x}" y="${nd.y}">${nd.id}</text><text class="ord" x="${nd.x + 20}" y="${nd.y - 18}"></text></g>`).join("")}
    </svg></div>
    <div class="log" id="glog"></div>`;
  let idx = 0;
  const log = () => {
    const visited = order.slice(0, idx).join(" ") || "—";
    const cur = idx ? snaps[idx - 1] : (algo === "BFS" ? [start] : []);
    $("#glog").innerHTML = `<span>방문: <b>${visited}</b></span>` +
      (algo === "BFS" ? `<span>큐: <b>[${cur.join(", ")}]</b></span>` : `<span>호출 스택: <b>${cur.join(" → ") || "(비어 있음)"}</b></span>`);
  };
  const click = el => {
    if (G.q.done || el.classList.contains("done")) return;
    const id = el.dataset.id;
    if (id !== order[idx]) {
      G.q.ex = `${idx + 1}번째로 방문할 정점은 ${order[idx]}였습니다. ` + G.q.ex;
      return resolve(false);
    }
    el.classList.add("done"); el.querySelector(".ord").textContent = ++idx; log();
    if (idx === order.length) resolve(true, { dmg: 2 });
  };
  body.querySelectorAll(".gnode").forEach(el => {
    el.addEventListener("click", () => click(el));
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); click(el); } });
  });
  log();
}

// ---------- Tree traversal puzzle ----------
function makeTree(n) {
  const vals = shuffle(Array.from({ length: 40 }, (_, i) => i + 1)).slice(0, n);
  const root = { v: vals[0], l: null, r: null, d: 0 }, all = [root];
  for (let i = 1; i < n; i++) {
    const slots = [];
    for (const nd of all) if (nd.d < 3) { if (!nd.l) slots.push([nd, "l"]); if (!nd.r) slots.push([nd, "r"]); }
    const [p, side] = pick(slots);
    const c = { v: vals[i], l: null, r: null, d: p.d + 1 };
    p[side] = c; all.push(c);
  }
  return { root, all };
}
function renderTree(body) {
  const D = DIFF[G.diff];
  const n = [5, 7, 8][D.size];
  const { root, all } = makeTree(n);
  const kinds = { pre: "전위", in: "중위", post: "후위", level: "레벨" };
  const pool = D.size === 0 ? ["pre", "level"] : D.size === 1 ? ["pre", "in", "post", "level"] : ["in", "post", "post"];
  const kind = pick(pool);
  const order = [];
  const walk = nd => { if (!nd) return; if (kind === "pre") order.push(nd); walk(nd.l); if (kind === "in") order.push(nd); walk(nd.r); if (kind === "post") order.push(nd); };
  if (kind === "level") { const q = [root]; while (q.length) { const u = q.shift(); order.push(u); if (u.l) q.push(u.l); if (u.r) q.push(u.r); } }
  else walk(root);
  const inord = []; const iw = nd => { if (!nd) return; iw(nd.l); inord.push(nd); iw(nd.r); }; iw(root);
  const W = 380, depth = Math.max(...all.map(a => a.d));
  const H = 50 + depth * 66 + 30;
  inord.forEach((nd, i) => { nd.x = n === 1 ? W / 2 : 30 + i * (W - 60) / (n - 1); nd.y = 30 + nd.d * 66; });
  const rule = { pre: "루트 → 왼쪽 → 오른쪽", in: "왼쪽 → 루트 → 오른쪽", post: "왼쪽 → 오른쪽 → 루트", level: "위층부터 한 층씩, 왼쪽에서 오른쪽" }[kind];
  G.q.answerText = order.map(o => o.v).join(" ");
  G.q.ex = `${kinds[kind]} 순회는 ${rule} 순서입니다.` + (kind === "in" ? " 이진 탐색 트리라면 중위 순회 결과가 정렬된 순서가 됩니다." : kind === "post" ? " 자식을 다 처리한 뒤 부모를 처리할 때(예: 폴더 크기 계산) 씁니다." : "");
  const lines = all.flatMap(nd => [nd.l, nd.r].filter(Boolean).map(c => `<line class="gedge" x1="${nd.x}" y1="${nd.y}" x2="${c.x}" y2="${c.y}"/>`)).join("");
  body.innerHTML = `
    <p class="q">이진 트리를 <b>${kinds[kind]} 순회</b> 순서대로 클릭하세요.</p>
    <p class="qsub">${kinds[kind]} 순회: ${rule}</p>
    <div class="svgbox"><svg viewBox="0 0 ${W} ${H}" width="${W}" role="group" aria-label="이진 트리">
      ${lines}
      ${all.map((nd, i) => `<g class="gnode" data-i="${i}" tabindex="0" role="button" aria-label="노드 ${nd.v}"><circle cx="${nd.x}" cy="${nd.y}" r="18"/><text x="${nd.x}" y="${nd.y}">${nd.v}</text><text class="ord" x="${nd.x + 19}" y="${nd.y - 17}"></text></g>`).join("")}
    </svg></div>
    <div class="log" id="tlog"></div>`;
  let idx = 0;
  const log = () => { $("#tlog").innerHTML = `<span>순회 결과: <b>${order.slice(0, idx).map(o => o.v).join(" ") || "—"}</b></span>`; };
  const click = el => {
    if (G.q.done || el.classList.contains("done")) return;
    const nd = all[+el.dataset.i];
    if (nd !== order[idx]) { G.q.ex = `${idx + 1}번째는 ${order[idx].v}였습니다. ` + G.q.ex; return resolve(false); }
    el.classList.add("done"); el.querySelector(".ord").textContent = ++idx; log();
    if (idx === order.length) resolve(true, { dmg: 2 });
  };
  body.querySelectorAll(".gnode").forEach(el => {
    el.addEventListener("click", () => click(el));
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); click(el); } });
  });
  log();
}

// ---------- Binary search puzzle ----------
function renderBsearch(body) {
  const n = [9, 13, 16][DIFF[G.diff].size];
  const arr = []; let v = rnd(1, 9);
  for (let i = 0; i < n; i++) { arr.push(v); v += rnd(1, 8); }
  let target;
  if (Math.random() < 0.7) target = pick(arr);
  else { const gaps = arr.slice(0, -1).map((x, i) => [x, arr[i + 1]]).filter(([a, b]) => b - a > 1); target = gaps.length ? pick(gaps)[0] + 1 : arr[n - 1] + 2; }
  const S = { lo: 0, hi: n - 1, probes: [], steps: [] };
  G.q.ex = "이진 탐색: <code>mid = (lo + hi) // 2</code>. arr[mid]가 target보다 작으면 <code>lo = mid + 1</code>, 크면 <code>hi = mid - 1</code>. lo가 hi를 넘으면 값이 없으니 -1.";
  body.innerHTML = `
    <p class="q">정렬된 배열에서 <code>${target}</code>을(를) 찾습니다. 매 단계 확인할 <b>mid</b> 칸을 클릭하세요.</p>
    <div class="bs" id="bsc"></div>
    <div class="row"><button class="btn ghost" id="bsno" hidden>-1 반환 (값이 없음)</button></div>
    <div class="log" id="bslog"></div>`;
  const draw = () => {
    $("#bsc").innerHTML = arr.map((x, i) => {
      const out = i < S.lo || i > S.hi, mark = i === S.lo && i === S.hi ? "lo·hi" : i === S.lo ? "lo" : i === S.hi ? "hi" : "";
      const cls = [out ? "out" : "", S.probes.includes(i) ? "probe" : "", S.found === i ? "found" : ""].join(" ");
      return `<button class="${cls}" data-i="${i}" ${G.q.done ? "disabled" : ""}><em>${S.lo <= S.hi ? mark : ""}</em><b>${x}</b><small>${i}</small></button>`;
    }).join("");
    $("#bslog").innerHTML = `<span>범위: <b>lo = ${S.lo}, hi = ${S.hi}</b></span>` + S.steps.map(s => `<span>${s}</span>`).join("");
    $("#bsno").hidden = S.lo <= S.hi || G.q.done;
    $("#bsc").querySelectorAll("button").forEach(b => b.onclick = () => choose(+b.dataset.i));
  };
  const choose = i => {
    if (G.q.done) return;
    if (S.lo > S.hi) { G.q.ex = "lo가 hi보다 커져서 범위가 비었습니다. 이때는 -1을 반환해야 합니다. " + G.q.ex; G.q.answerText = "-1"; return resolve(false); }
    const mid = Math.floor((S.lo + S.hi) / 2);
    if (i !== mid) { G.q.answerText = `mid = (${S.lo} + ${S.hi}) // 2 = ${mid}`; G.q.ex = `lo = ${S.lo}, hi = ${S.hi}이므로 다음에 볼 칸은 인덱스 ${mid}입니다. ` + G.q.ex; resolve(false); return draw(); }
    S.probes.push(mid);
    if (arr[mid] === target) { S.found = mid; S.steps.push(`mid = <b>${mid}</b>, arr[${mid}] = ${arr[mid]} → 찾았다!`); resolve(true, { dmg: 2 }); return draw(); }
    if (arr[mid] < target) { S.steps.push(`mid = <b>${mid}</b>, arr[${mid}] = ${arr[mid]} &lt; ${target} → lo = ${mid + 1}`); S.lo = mid + 1; }
    else { S.steps.push(`mid = <b>${mid}</b>, arr[${mid}] = ${arr[mid]} &gt; ${target} → hi = ${mid - 1}`); S.hi = mid - 1; }
    draw();
  };
  $("#bsno").onclick = () => { if (G.q.done) return; S.steps.push(`lo(${S.lo}) &gt; hi(${S.hi}) → -1 반환`); resolve(true, { dmg: 2 }); draw(); };
  draw();
}

// =====================================================================
// Timer, resolution, end screens
// =====================================================================
function startTimer() {
  stopTimer();
  let last = performance.now();
  timerId = setInterval(() => {
    const now = performance.now(); G.q.left -= (now - last) / 1000; last = now;
    const f = Math.max(0, G.q.left / G.q.limit);
    const t = $("#timer"); if (!t) return;
    $("#tfill").style.width = f * 100 + "%";
    t.classList.toggle("low", f < 0.3);
    if (G.q.left <= 0 && !G.q.done) {
      $("#qbody").querySelectorAll("button, input").forEach(x => x.disabled = true);
      G.q.timeout = true; resolve(false);
    }
  }, 100);
}
function stopTimer() { clearInterval(timerId); timerId = null; }

function floatText(txt) {
  const d = document.createElement("div"); d.className = "dmg"; d.textContent = txt;
  $("#arena").appendChild(d); setTimeout(() => d.remove(), 900);
}
function anim(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

function resolve(ok, { dmg = 1, mul = 1, extra = "" } = {}) {
  if (G.q.done) return;
  G.q.done = true; stopTimer(); G.tried++;
  const D = DIFF[G.diff];
  let gained = 0, crit = false, killed = false, healed = false;
  if (ok) {
    G.solved++; G.combo++; G.bestCombo = Math.max(G.bestCombo, G.combo);
    crit = G.combo >= 3;
    const hit = dmg + (crit ? 1 : 0);
    G.mon.hp = Math.max(0, G.mon.hp - hit);
    const speed = G.q.limit ? Math.max(0, G.q.left / G.q.limit) : 0.6;
    gained = Math.round((100 * dmg + 60 * speed) * (1 + Math.min(G.combo, 5) * 0.2) * (1 + (G.floor - 1) * 0.1) * D.score * mul);
    G.score += gained;
    anim($("#spr"), "hit"); floatText((crit ? "CRIT -" : "-") + hit);
    if (G.mon.hp === 0) {
      killed = true; G.kills++;
      if (G.mode === "endless" && G.mon.boss && G.hp < G.maxHp) { G.hp++; healed = true; }
    }
  } else {
    G.combo = 0; G.hp--;
    anim($("#app"), "shake");
  }
  updateHud();
  const stageDone = killed && G.mode === "stage" && G.floor === STAGE_FLOORS;

  const fb = document.createElement("div");
  fb.className = "feedback " + (ok ? "ok" : "no");
  const head = ok ? (killed ? `${G.mon.n} 처치!` : crit ? "크리티컬!" : "명중!") : (G.q.timeout ? "시간 초과" : "빗나감");
  const sub = ok ? `+${gained.toLocaleString()}점${healed ? " · 하트 1개 회복" : ""}` : (G.q.answerText ? `정답: <code>${esc(G.q.answerText)}</code>` : "");
  const nextLabel = G.hp <= 0 ? "결과 보기" : stageDone ? "스테이지 클리어" : killed ? "다음 층으로" : "계속";
  fb.innerHTML = `<h3>${head}</h3>${sub ? `<p>${sub}</p>` : ""}<p>${G.q.ex}</p>${extra}
    ${G.q.runnable ? `<div class="row"><button class="btn ghost small" id="tryrun">▶ 직접 실행해 보기</button><span class="status" id="trystatus"></span></div><div id="tryout"></div>` : ""}
    <div class="row"><button class="btn" id="next">${nextLabel} (Enter)</button></div>`;
  $("#con").appendChild(fb);
  if (G.q.runnable) {
    const src = G.q.runnable;
    $("#tryrun").onclick = async () => {
      const b = $("#tryrun"), st = $("#trystatus"); b.disabled = true;
      st.className = "status"; st.textContent = pyReady ? "실행 중…" : "파이썬 엔진 불러오는 중… (처음 한 번만)";
      await new Promise(r => setTimeout(r, 30));
      try {
        const r = await runPython(src);
        st.textContent = "실제 실행 결과";
        $("#tryout").innerHTML = `<pre class="code small">${esc(r.out + (r.err ? r.err : "")) || "(출력 없음)"}</pre>`;
      } catch (e) { st.className = "status err"; st.textContent = e.message; b.disabled = false; }
    };
  }
  const next = $("#next"); next.focus();
  next.onclick = () => {
    if (G.hp <= 0) return gameOver();
    if (stageDone) return stageClear();
    if (killed) { G.floor++; return newMonster(); }
    nextQuestion();
  };
}

function statsHtml() {
  const acc = G.tried ? Math.round(G.solved / G.tried * 100) : 0;
  return `<div class="stats">
    <div><b>${G.kills}</b>처치한 몬스터</div>
    <div><b>${G.solved}/${G.tried}</b>정답</div>
    <div><b>${acc}%</b>정확도</div>
    <div><b>x${G.bestCombo}</b>최고 콤보</div></div>`;
}

function stageClear() {
  stopTimer();
  const ratio = G.hp / G.maxHp;
  const stars = ratio >= 1 ? 3 : ratio >= 0.5 ? 2 : 1;
  const all = store.get("pd-stars", {}), key = G.stage.id + ":" + G.diff;
  const prev = all[key] || 0;
  if (stars > prev) { all[key] = stars; store.set("pd-stars", all); }
  const idx = STAGES.findIndex(s => s.id === G.stage.id);
  const nextStage = STAGES[(idx + 1) % STAGES.length];
  app.innerHTML = `
    <section class="screen">
      <h1>${G.stage.name} 돌파<small>${DIFF[G.diff].name} · ${stars > prev ? "새 기록" : `최고 기록 ${prev}★`}</small></h1>
      ${starsHtml(stars, "bigstars")}
      <div class="big">${G.score.toLocaleString()}</div>
      ${statsHtml()}
      <p class="muted">별: 하트를 하나도 잃지 않으면 ★3, 절반 이상 남기면 ★2.</p>
      <div class="row"><button class="btn" id="nexts">다음: ${nextStage.name}</button><button class="btn ghost" id="again">다시 도전</button><button class="btn ghost" id="menu">메뉴</button></div>
    </section>`;
  const st = G.stage;
  $("#nexts").onclick = () => startGame({ mode: "stage", stage: nextStage });
  $("#again").onclick = () => startGame({ mode: "stage", stage: st });
  $("#menu").onclick = menu;
  $("#nexts").focus();
}

function gameOver() {
  stopTimer();
  const where = G.mode === "stage" ? `${G.stage.name} ${G.floor}층` : `B${G.floor}F`;
  let note = "";
  if (G.mode === "endless") {
    const key = "pd-best-" + G.diff, prev = store.get(key, 0);
    if (G.score > prev) { store.set(key, G.score); note = "새 최고 기록입니다."; } else note = `${DIFF[G.diff].name} 최고 기록 ${prev.toLocaleString()}점`;
  } else note = "보스까지 가려면 남은 하트를 아끼세요.";
  const cfg = G.mode === "stage" ? { mode: "stage", stage: G.stage } : { mode: "endless", types: G.types };
  app.innerHTML = `
    <section class="screen">
      <h1>${where}에서 쓰러졌다<small>${note}</small></h1>
      <div class="big">${G.score.toLocaleString()}</div>
      ${statsHtml()}
      <div class="row"><button class="btn" id="again">다시 도전</button><button class="btn ghost" id="menu">메뉴</button></div>
    </section>`;
  $("#again").onclick = () => startGame(cfg);
  $("#menu").onclick = menu;
  $("#again").focus();
}

document.addEventListener("keydown", e => {
  if (!G || !G.q) return;
  if (e.target.matches("input, textarea") && !G.q.done) return;
  if (e.key === "Enter" && G.q.done) {
    const n = $("#next");
    if (n && document.activeElement !== n && !(document.activeElement && document.activeElement.id === "tryrun")) { e.preventDefault(); n.click(); }
    return;
  }
  if (!G.q.done && G.q.keys) G.q.keys(e);
});

menu();
</script>
